<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores amarillas 🌼</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #fff8c5, #ffe082, #fff3b0);
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .card {
      text-align: center;
      padding: 40px 25px;
      max-width: 500px;
      animation: aparecer 1.5s ease;
    }

    h1 {
      color: #d89b00;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    p {
      color: #6d5200;
      font-size: 1.2rem;
      line-height: 1.6;
    }

    .flowers {
      font-size: 4rem;
      margin: 20px 0;
      animation: flotar 3s ease-in-out infinite;
    }

    button {
      border: none;
      padding: 14px 25px;
      border-radius: 30px;
      background: #f7c600;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 5px 15px #d6a90066;
      transition: .3s;
    }

    button:hover {
      transform: scale(1.08);
      background: #e5ae00;
    }

    #mensaje {
      display: none;
      margin-top: 20px;
      color: #8a6200;
      font-weight: bold;
    }

    .petalo {
      position: absolute;
      top: -50px;
      font-size: 25px;
      animation: caer linear infinite;
      opacity: .8;
    }

    @keyframes caer {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    @keyframes flotar {
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes aparecer {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="flowers">🌻🌼🌻</div>

    <h1>Flores amarillas para ti 💛</h1>

    <p>
      Que hoy florezca todo lo bonito en tu vida,
      así como estas flores florecen para recordarte
      lo especial que eres. 🌼✨
    </p>

    <button onclick="mostrarMensaje()">
      Toca aquí 🌻
    </button>

    <div id="mensaje">
      💛 Que nunca te falten motivos para sonreír.
    </div>
  </div>

  <script>
    function mostrarMensaje() {
      document.getElementById("mensaje").style.display = "block";
    }

    // Flores cayendo
    for (let i = 0; i < 20; i++) {
      const flor = document.createElement("div");

      flor.className = "petalo";
      flor.textContent = Math.random() > 0.5 ? "🌼" : "💛";

      flor.style.left = Math.random() * 100 + "vw";
      flor.style.animationDuration = (4 + Math.random() * 5) + "s";
      flor.style.animationDelay = Math.random() * 5 + "s";

      document.body.appendChild(flor);
    }
  </script>

</body>
</html>
