<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>San Valentín ❤️</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #ff4e8a, #8b0000);
  font-family: 'Georgia', serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

/* MENSAJE */
.mensaje {
  position: absolute;
  text-align: center;
  font-size: 3.5em;
  z-index: 10;
  text-shadow: 0 0 20px #ffb6c1;
  animation: aparecer 3s ease-in-out forwards;
  opacity: 0;
}

@keyframes aparecer {
  to { opacity: 1; }
}

/* CONTENEDOR */
.rosas {
  position: absolute;
  bottom: 0;
  display: flex;
  gap: 40px;
}

/* TALLO */
.tallo {
  width: 6px;
  height: 200px;
  background: green;
  position: relative;
  animation: crecer 3s ease-out forwards;
  transform-origin: bottom;
  transform: scaleY(0);
}

@keyframes crecer {
  to { transform: scaleY(1); }
}

/* FLOR */
.rosa {
  width: 80px;
  height: 80px;
  background: radial-gradient(circle, #ff1a4d, #b3002d);
  border-radius: 50%;
  position: absolute;
  top: -60px;
  left: -37px;
  box-shadow: 0 0 20px rgba(255,0,80,0.7);
}

/* HOJAS */
.hoja {
  width: 40px;
  height: 20px;
  background: green;
  position: absolute;
  border-radius: 50%;
}

.hoja.izq {
  left: -40px;
  top: 100px;
  transform: rotate(-30deg);
}

.hoja.der {
  right: -40px;
  top: 130px;
  transform: rotate(30deg);
}

/* CORAZONES */
.corazon {
  position: absolute;
  bottom: -50px;
  font-size: 24px;
  animation: flotar 6s linear infinite;
  opacity: 0.7;
}

@keyframes flotar {
  0% { transform: translateY(0); opacity: 0.7; }
  100% { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<div class="mensaje">
  ❤️ Feliz San Valentín ❤️<br>
  Te quiero mucho 🌹
</div>

<div class="rosas">
  <div class="tallo">
    <div class="rosa"></div>
    <div class="hoja izq"></div>
    <div class="hoja der"></div>
  </div>
  <div class="tallo">
    <div class="rosa"></div>
    <div class="hoja izq"></div>
    <div class="hoja der"></div>
  </div>
  <div class="tallo">
    <div class="rosa"></div>
    <div class="hoja izq"></div>
    <div class="hoja der"></div>
  </div>
</div>

<script>
function crearCorazon() {
  const corazon = document.createElement("div");
  corazon.className = "corazon";
  corazon.innerHTML = "💖";
  corazon.style.left = Math.random() * window.innerWidth + "px";
  corazon.style.animationDuration = (4 + Math.random() * 3) + "s";
  document.body.appendChild(corazon);

  setTimeout(() => {
    corazon.remove();
  }, 6000);
}

setInterval(crearCorazon, 500);
</script>

</body>
</html>
